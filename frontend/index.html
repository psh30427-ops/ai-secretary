<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학사 일정 AI 비서</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="server-banner" class="banner" role="status" hidden>
    <span id="server-banner-text"></span>
    <button type="button" id="server-banner-close" class="banner-close" aria-label="닫기">×</button>
  </div>

  <header class="topbar">
    <h1>학사 일정 AI 비서</h1>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="chat" role="tab" aria-selected="true">채팅</button>
      <button type="button" class="tab" data-tab="data" role="tab" aria-selected="false">데이터 관리</button>
    </nav>
  </header>

  <main>
    <!-- 채팅 탭 -->
    <section id="tab-chat" class="tab-panel chat-layout">
      <aside class="panel conv-panel">
        <div class="panel-head">
          <h2>대화 기록</h2>
          <button type="button" id="new-chat" class="btn btn-small">+ 새 대화</button>
        </div>
        <ul id="conv-list" class="conv-list"></ul>
        <p id="conv-empty" class="muted small" hidden>저장된 대화가 없습니다.</p>
      </aside>

      <section class="panel chat-panel">
        <div class="panel-head">
          <h2 id="chat-title">새 대화</h2>
        </div>
        <div id="messages" class="messages" aria-live="polite">
          <div class="welcome" id="welcome">
            <p>SmartLEAD 일정 데이터를 알고 있는 AI 비서입니다. 이렇게 물어보세요.</p>
            <div class="suggestions">
              <button type="button" class="chip">이번 주에 뭐 해야 해?</button>
              <button type="button" class="chip">이번 달이 지난달보다 바빠?</button>
              <button type="button" class="chip">가장 급한 과제 3개만 알려줘</button>
            </div>
          </div>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="1" maxlength="2000" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
          <button type="submit" id="chat-send" class="btn">전송</button>
        </form>
      </section>

      <aside class="panel summary-panel">
        <div class="panel-head">
          <h2>데이터 요약</h2>
          <button type="button" id="summary-refresh" class="btn btn-small btn-ghost" title="새로고침">↻</button>
        </div>
        <div id="summary"><p class="muted small">불러오는 중…</p></div>
      </aside>
    </section>

    <!-- 데이터 관리 탭 -->
    <section id="tab-data" class="tab-panel" hidden>
      <div class="data-layout">
        <form id="data-form" class="panel data-form" novalidate>
          <div class="panel-head">
            <h2 id="data-form-title">새 일정 추가</h2>
          </div>
          <label>날짜
            <input type="date" id="f-date" required />
          </label>
          <label>분류
            <select id="f-category">
              <option>시험</option><option>과제</option><option>퀴즈</option>
              <option>강의시청</option><option>법정교육</option><option>신청</option><option selected>개인</option>
            </select>
          </label>
          <label>내용 <span class="muted small">(예: 마케팅원론 - 최종과제물 제출)</span>
            <input type="text" id="f-text" maxlength="180" required />
          </label>
          <div class="row">
            <label>마감 시각 <span class="muted small">(선택)</span>
              <input type="time" id="f-time" />
            </label>
            <label>중요도
              <select id="f-value">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option>
              </select>
            </label>
          </div>
          <p class="small">저장될 memo: <code id="f-preview"></code></p>
          <p id="data-form-msg" class="form-msg" role="alert"></p>
          <div class="row">
            <button type="submit" id="data-submit" class="btn">추가</button>
            <button type="button" id="data-cancel" class="btn btn-ghost" hidden>수정 취소</button>
          </div>
        </form>

        <section class="panel data-list-panel">
          <div class="panel-head">
            <h2>일정 목록 <span id="data-count" class="muted small"></span></h2>
            <div class="row">
              <select id="filter-category" aria-label="분류 필터"><option value="">전체 분류</option></select>
              <input type="search" id="filter-text" placeholder="검색" aria-label="검색" />
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>날짜</th><th>중요도</th><th>memo</th><th></th></tr></thead>
              <tbody id="data-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- config.js는 API_BASE_URL을 정의한다. Vercel에서는 빌드 때 build-config.js가 다시 생성한다. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
